# Paramètre globaux et de sécurité qui s'applique au processus HA Proxy 
global
    log /dev/log local0
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

# Valeurs de configuration par défaut appliqués au bloc frontend et backend
defaults
    log global
    mode http
    option httplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Le point d'entrée unique (Frontend)
frontend mon_front_cluster
    bind 127.0.0.1:8080
    default_backend mes_serveurs_back

# La répartition de charge (Backend avec Round Robin)
backend mes_serveurs_back
    balance roundrobin
    server servA 127.0.0.1:8081 check
    server servB 127.0.0.1:8082 check